name: Nova Windows x64 Acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Nova sources
        uses: actions/checkout@v4
      - name: Verify self-host test in checked-out Git revision
        run: |
          Write-Host "GitHub event: $env:GITHUB_EVENT_NAME"
          Write-Host "GitHub ref: $env:GITHUB_REF"
          Write-Host "GitHub SHA: $env:GITHUB_SHA"
          Write-Host "Checked-out commit: $(git rev-parse HEAD)"
          Write-Host "Working directory: $(Get-Location)"
          Write-Host "Checkout root: $env:GITHUB_WORKSPACE"
          $relative = 'tests/smoke_selfhost07.ps1'
          $target = Join-Path $env:GITHUB_WORKSPACE 'tests\smoke_selfhost07.ps1'
          Write-Host "Git tree entry for $relative :"
          git ls-tree HEAD -- $relative
          Write-Host 'Files in tests folder:'
          $testDir = Join-Path $env:GITHUB_WORKSPACE 'tests'
          if (Test-Path -LiteralPath $testDir -PathType Container) {
            Get-ChildItem -LiteralPath $testDir -Force | ForEach-Object { Write-Host $_.Name }
          } else {
            Write-Host 'tests/ folder is missing from checkout'
          }
          if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
            throw "Missing at checkout: $target. This workflow run is not using a commit that contains the expected test at the correct path (or checkout omitted it)."
          }
          Write-Host 'PASS: self-host smoke script exists immediately after checkout.'
      - name: Python for tests and PE metadata checks only
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize Microsoft C++ x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build real Windows x64 console runtime, GUI runner and Nova Studio
        run: ./build_windows.ps1 -Compiler MSVC
      - name: Check produced PE32+ binaries and subsystems
        run: >-
          python tools/verify_pe.py bin/nova-native.exe bin/nova-windowed.exe bin/NovaStudio.exe
          --console nova-native.exe --gui nova-windowed.exe --gui NovaStudio.exe
      - name: Build again with CMake and run native C++ editor tests
        run: |
          cmake -S . -B build-acceptance -G 'Visual Studio 17 2022' -A x64
          cmake --build build-acceptance --config Release --target nova-native nova-windowed NovaStudio nova-studio-text-tests nova-studio-ai-tests nova-studio-next14-tests nova-studio-designer15-tests nova-studio-trinity16-tests nova-studio-living17-tests nova-studio-aiproof18-tests nova-studio-next19-tests nova-studio-designer19-tests
          ctest --test-dir build-acceptance -C Release --output-on-failure
      - name: Nova Studio headless text engine and real Win32 controls
        run: |
          $traceFile = Join-Path $env:RUNNER_TEMP 'nova-studio-gui-smoke.log'
          $env:NOVA_STUDIO_TRACE_FILE = $traceFile
          foreach ($mode in @('--self-test', '--gui-smoke')) {
            $p = Start-Process -FilePath (Resolve-Path bin/NovaStudio.exe) -ArgumentList $mode -PassThru
            try {
              if (-not $p.WaitForExit(15000)) { throw "Studio $mode timeout" }
              if ($p.ExitCode -ne 0) {
                Write-Host "Nova Studio $mode failed: $($p.ExitCode)"
                if (Test-Path -LiteralPath $traceFile) {
                  Write-Host '--- Nova Studio GUI trace (last 100 lines) ---'
                  Get-Content -LiteralPath $traceFile -Tail 100 | ForEach-Object { Write-Host $_ }
                } else { Write-Host 'No GUI trace was created.' }
                throw "Studio $mode failed: $($p.ExitCode)"
              }
            } finally {
              if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
              $p.Dispose()
            }
          }
          if (Test-Path -LiteralPath $traceFile) {
            Write-Host '--- Nova Studio GUI trace (last 30 lines) ---'
            Get-Content -LiteralPath $traceFile -Tail 30 | ForEach-Object { Write-Host $_ }
          }
      - name: Native self-hosting A to B and Windows compiler EXE
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'tests\smoke_selfhost07.ps1'
          Write-Host "Running test: $scriptPath"
          Write-Host "Current directory: $(Get-Location)"
          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
            Write-Host "Checked-out commit: $(git rev-parse HEAD)"
            Write-Host 'Git entry at this commit:'
            git ls-tree HEAD -- 'tests/smoke_selfhost07.ps1'
            Write-Host 'Git status of tests:'
            git status --short -- tests
            throw "Missing before self-host execution: $scriptPath. Compare with the early checkout verification step."
          }
          & $scriptPath
      - name: Windows compilerless build and integrity tests
        run: |
          ./nova.ps1 doctor
          ./tests/smoke_portable08.ps1
          ./tests/smoke_windows.ps1
      - name: Real Nova Win32 event-driven button test
        run: ./tests/smoke_win32_click.ps1
      - name: Full Python-driven native interpreter regression tests (not runtime dependency)
        run: python -m unittest discover -s tests -v
      - name: Prepare portable Windows ZIP inputs
        run: ./tools/create_windows_portable.ps1
      - name: Accept installed copy outside repository (Unicode path)
        run: ./tools/test_windows_portable.ps1
      - name: Archive portable Windows distribution with SHA256
        run: |
          $zip='dist/Nova-Windows-x64-Beta2.zip'
          Compress-Archive -Path 'dist/windows-x64/Nova' -DestinationPath $zip -CompressionLevel Optimal
          $hash=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText('dist/Nova-Windows-x64-Beta2.zip.sha256', "$hash *Nova-Windows-x64-Beta2.zip`n",[Text.UTF8Encoding]::new($false))
          "### Windows x64 acceptance PASSED" >> $env:GITHUB_STEP_SUMMARY
          "- Nova Studio, native runtime, self-hosting and GUI button callback passed." >> $env:GITHUB_STEP_SUMMARY
          "- Download the *nova-windows-x64* artifact from this run." >> $env:GITHUB_STEP_SUMMARY
          "- ZIP SHA256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload tested Windows x64 ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: nova-windows-x64
          path: |
            dist/Nova-Windows-x64-Beta2.zip
            dist/Nova-Windows-x64-Beta2.zip.sha256
          if-no-files-found: error
          retention-days: 21
      - name: Upload Windows diagnostic logs if acceptance fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nova-windows-diagnostics
          path: |
            ${{ runner.temp }}/nova-studio-gui-smoke.log
            build-acceptance/Testing/Temporary/LastTest.log
            build-acceptance/CMakeFiles/CMakeConfigureLog.yaml
            build-acceptance/CMakeCache.txt
          if-no-files-found: ignore
